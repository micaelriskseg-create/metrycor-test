<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Metrycor — Protótipo de interface</title>
<style>
:root{color-scheme:dark;--bg:#080811;--pn:#10101D;--cd:#171529;--p:#8B5CF6;--n:#A855F7;--vl:#C4B5FD;--ok:#22C55E;--wr:#F59E0B;--er:#EF4444;--tx:#F8FAFC;--t2:#A1A1B5;--bd:#29253F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:system-ui,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select{font:inherit;color:inherit}input,select{background:#0c0b18;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;width:100%}
.b{background:linear-gradient(135deg,var(--p),#4C1D95);border:1px solid #6d44c9;border-radius:8px;padding:7px 13px;cursor:pointer;transition:.2s}.b:hover{box-shadow:0 0 14px #8b5cf666}.b.g{background:none;border-color:var(--bd)}.b:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--vl)}
#mx{position:fixed;inset:0;width:100%;height:100%;opacity:.4}
#login{position:fixed;inset:0;display:grid;place-items:center;padding:16px;z-index:9}.box{position:relative;width:min(400px,100%);background:#10101dee;border:1px solid var(--bd);border-radius:16px;padding:26px;box-shadow:0 0 40px #8b5cf633}
.logo{font-weight:800;letter-spacing:.18em;font-size:21px;background:linear-gradient(90deg,var(--vl),var(--n));-webkit-background-clip:text;color:transparent}.fl{margin:10px 0}.fl label{font-size:12px;color:var(--t2);display:block;margin-bottom:4px}
.sh{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.sd{background:var(--pn);border-right:1px solid var(--bd);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.nv{display:flex;gap:9px;padding:9px 10px;border-radius:8px;color:var(--t2);cursor:pointer;margin-bottom:2px;border:0;background:none;width:100%;text-align:left}.nv:hover{background:#1f1b3a;color:var(--tx)}.nv.on{background:linear-gradient(90deg,#4c1d9566,transparent);color:var(--vl);box-shadow:inset 2px 0 var(--n)}.nv.s{padding-left:30px;font-size:13px}
.tp{display:flex;gap:10px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--bd);background:#0b0b16;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}.tp input{max-width:320px}.sp{flex:1}
.bn{background:#4c1d9588;border-bottom:1px solid var(--p);text-align:center;padding:4px;font-size:12px;color:var(--vl)}
.pg{padding:18px;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}h1{margin:0 0 12px;font-size:21px}h3{margin:0 0 10px;font-size:15px}
.cs{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:11px;margin-bottom:14px}.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:13px;transition:.2s}.c:hover{border-color:#8b5cf688}.v{font-size:21px;font-weight:700;margin:3px 0}.l,.h{color:var(--t2);font-size:12px}.up{color:var(--ok)}.dn{color:var(--er)}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px}.rw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:11px}.rw select{width:auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--t2);font-weight:500;font-size:12px}
.pl{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid currentColor}.ok{color:var(--ok)}.wr{color:var(--wr)}.er{color:var(--er)}.vi{color:var(--vl)}
.bd{display:flex;gap:11px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}.cl{min-width:230px;width:230px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:9px}.cl.ov{border-color:var(--n);box-shadow:0 0 16px #a855f755}.cl h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between}
.kc{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--p);border-radius:8px;padding:8px;margin-bottom:7px;cursor:grab;font-size:12px}.kc.a{border-left-color:var(--er)}.kc.m{border-left-color:var(--wr)}.kc.l2{border-left-color:var(--ok)}.kc div{color:var(--t2);margin-top:2px}
.bar{height:9px;border-radius:5px;background:linear-gradient(90deg,#4C1D95,var(--n))}.tb{display:flex;gap:4px;border-bottom:1px solid var(--bd);margin-bottom:12px;overflow-x:auto}.tb button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--t2);cursor:pointer}.tb button.on{color:var(--vl);border-color:var(--n)}
.wa{display:grid;grid-template-columns:250px 1fr 240px;gap:0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-height:480px;background:var(--pn)}.wa>div{padding:11px;border-right:1px solid var(--bd)}.wa>div:last-child{border:0}.cv{padding:8px;border-radius:8px;cursor:pointer}.cv:hover,.cv.on{background:#1f1b3a}.ms{max-width:75%;padding:8px 11px;border-radius:12px;margin:6px 0;background:var(--cd);font-size:13px}.ms.me{margin-left:auto;background:#4C1D95}.ms.nt{background:#f59e0b22;border:1px dashed var(--wr);margin-left:auto}
.tg{position:relative;width:38px;height:20px;background:var(--bd);border-radius:10px;cursor:pointer;border:0}.tg.on{background:var(--p)}.tg::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.tg.on::after{left:20px}
.tcl{min-width:240px;width:240px;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:9px}.tcl.ov{border-color:var(--n);box-shadow:0 0 16px #a855f755}.tcl h4{margin:0 0 8px;font-size:12px;display:flex;justify-content:space-between}
.tk{background:var(--cd);border:1px solid var(--bd);border-left:3px solid var(--p);border-radius:8px;padding:8px;margin-bottom:7px;cursor:grab;font-size:12px}.tk:hover{border-color:var(--p)}.tk.a{border-left-color:var(--er)}.tk.m{border-left-color:var(--wr)}.tk.l2{border-left-color:var(--ok)}.tk div{color:var(--t2);margin-top:3px}.tk.dn2 b{text-decoration:line-through;opacity:.6}
.mo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:50;padding:12px}.mdl{background:var(--pn);border:1px solid var(--bd);border-radius:14px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:20px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tt{position:fixed;right:16px;bottom:16px;background:var(--cd);border:1px solid var(--p);border-radius:8px;padding:10px 14px;display:none;z-index:99}
@media(max-width:800px){.sh{grid-template-columns:1fr}.sd{position:static;height:auto;display:flex;overflow-x:auto;padding:6px}.nv.s{padding-left:10px}.logo{display:none}.wa{grid-template-columns:1fr}.wa>div{border-right:0;border-bottom:1px solid var(--bd)}.pg{padding:11px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#mx{display:none}}
</style></head><body>
<canvas id="mx" aria-hidden="true"></canvas>
<div id="login"><form class="box" id="lf"><div class="logo">METRYCOR</div><p class="h">Protótipo de interface para validação — nenhum dado é salvo.</p>
<div class="fl"><label>Usuário ou e-mail</label><input value="admin" autocomplete="off"></div><div class="fl"><label>Senha</label><input type="password" value="admin"></div>
<button class="b" style="width:100%">Entrar</button><p class="h" style="text-align:center"><a href="#" style="color:var(--vl)">Esqueci minha senha</a> · <a href="#" style="color:var(--vl)">Criar uma conta</a></p></form></div>
<div id="app" hidden></div><div id="tt" role="status"></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const toast=t=>{const e=$("#tt");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)};
// Matrix (só no login)
const cv=$("#mx"),x=cv.getContext("2d");let dr=[];const rs=()=>{cv.width=innerWidth;cv.height=innerHeight;dr=Array.from({length:Math.ceil(cv.width/16)},()=>Math.random()*50)};rs();addEventListener("resize",rs);
const mt=setInterval(()=>{x.fillStyle="rgba(8,8,17,.12)";x.fillRect(0,0,cv.width,cv.height);x.font="16px monospace";dr.forEach((y,i)=>{x.fillStyle=Math.random()>.9?"#C4B5FD":"#8B5CF6";x.fillText(Math.random()>.5?"1":"0",i*16,y*16);if(y*16>cv.height&&Math.random()>.975)dr[i]=0;dr[i]++})},70);
// Dados fictícios
const SEL=["Ana Souza","Bruno Lima","Carla Dias"],CAT=["Automóvel","Vida","Residencial","Empresarial","Saúde"];
const ST=[["Novo lead","#A1A1B5"],["Primeiro contato","#C4B5FD"],["Em atendimento","#A78BFA"],["Cotação solicitada","#8B5CF6"],["Proposta enviada","#A855F7"],["Em negociação","#9333EA"],["Aguardando documentação","#F59E0B"],["Venda concluída","#22C55E"],["Perdido ou cancelado","#EF4444"]];
const NM=["Marina Alves","Rafael Costa","Tatiane Mello","Otávio Ribeiro","Lúcia Ferraz","Diego Matos","Helena Prado","Gustavo Lima","Patrícia Nunes","Caio Duarte","Fernanda Reis","Sérgio Moraes","Vera Campos","Igor Teixeira"];
const LD=NM.map((n,i)=>({n,st:i%9,cat:CAT[i%5],s:SEL[i%3],p:(18+i*7)*100,pr:["a","m","l2"][i%3],d:i%6+1}));
const FIN=[["Prêmios negociados",412800],["Corretagem prevista",49536],["Corretagem recebida",31200],["Corretagem a receber",18336],["Comissões previstas",16512],["Comissões pagas",9800],["Cancelamentos (estornos)",-3100],["Resultado gerencial",21400]];
const PO=[["AP-10231","Marina Alves","Automóvel","Porto Seguro","12/11/2026",2840,"vi"],["AP-10388","Rafael Costa","Vida","Bradesco Seguros","02/12/2026",1260,"ok"],["AP-10412","Tatiane Mello","Residencial","Allianz","18/11/2026",980,"wr"],["AP-10477","Lúcia Ferraz","Empresarial","SulAmérica","29/01/2027",12400,"ok"],["AP-10502","Diego Matos","Saúde","Hapvida","05/11/2026",5400,"er"]];
const NAV=[["dash","▣","Dashboard"],["vend","◈","Gestão de Vendas",[["kan","Kanban"],["leads","Leads"],["cli","Clientes"],["eq","Equipe comercial"]]],["tar","☑","Tarefas"],["fin","$","Gestão Financeira"],["pol","▤","Gestão de Apólices"],["wa","✆","WhatsApp"],["rel","▥","Relatórios"],["cfg","⚙","Configurações"]];
let pg="dash",col=false,tkF="",tkId=100;
const E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TC=[["todo","A fazer","#A1A1B5"],["doing","Em andamento","#8B5CF6"],["wait","Aguardando","#F59E0B"],["done","Concluída","#22C55E"]];
const hoje=()=>new Date().toISOString().slice(0,10),fd=s=>s.split("-").reverse().join("/");
const TK=[["Retornar contato com Marina Alves","Enviar cotação do seguro auto","Ana Souza",0,"a","todo"],["Renovação AP-10412 (Tatiane Mello)","Iniciar contato — vence em 30 dias","Bruno Lima",0,"m","todo"],["Cobrar documentos de Vera Campos","RG e comprovante de residência","Carla Dias",-2,"a","wait"],["Enviar proposta para Diego Matos","Plano de saúde empresarial","Ana Souza",1,"m","doing"],["Reunião com Gustavo Lima","Levantamento de necessidades","Bruno Lima",3,"l2","todo"],["Conferir repasse da Porto Seguro","Comparar com corretagem prevista","Carla Dias",-1,"m","doing"],["Emitir apólice de Helena Prado","Seguro residencial","Ana Souza",-3,"l2","done"]].map((a,i)=>({id:i+1,t:a[0],d:a[1],r:a[2],dt:new Date(Date.now()+a[3]*864e5).toISOString().slice(0,10),p:a[4],s:a[5]}));
function bindTk(){$$(".tk").forEach(k=>{k.ondragstart=e=>e.dataTransfer.setData("text",k.dataset.k);k.onclick=()=>tkForm(+k.dataset.k);k.onkeydown=e=>{if(e.key=="Enter")tkForm(+k.dataset.k)}});
$$("[data-ts]").forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add("ov")};c.ondragleave=()=>c.classList.remove("ov");c.ondrop=e=>{e.preventDefault();const k=TK.find(x=>x.id==e.dataTransfer.getData("text"));if(k&&k.s!=c.dataset.ts){k.s=c.dataset.ts;draw();toast("Tarefa movida para “"+TC.find(x=>x[0]==k.s)[1]+"”")}}})}
function tkForm(id,st){const k=id?TK.find(x=>x.id==id):{t:"",d:"",r:SEL[0],dt:hoje(),p:"m",s:st||"todo"};
const o=document.createElement("div");o.className="mo";
o.innerHTML=`<form class="mdl" role="dialog" aria-modal="true" aria-label="Tarefa"><h3>${id?"Editar tarefa":"Nova tarefa"}</h3><div class="fl"><label>Título *</label><input name="t" required></div><div class="fl"><label>Descrição</label><input name="d"></div><div class="g2"><div class="fl"><label>Responsável</label><select name="r">${SEL.map(s=>`<option>${s}</option>`).join("")}</select></div><div class="fl"><label>Data</label><input type="date" name="dt" required></div><div class="fl"><label>Prioridade</label><select name="p"><option value="a">Alta</option><option value="m">Média</option><option value="l2">Baixa</option></select></div><div class="fl"><label>Status</label><select name="s">${TC.map(c=>`<option value="${c[0]}">${c[1]}</option>`).join("")}</select></div></div><div class="rw" style="margin-top:12px"><button class="b">Salvar</button><button type="button" class="b g" data-c>Cancelar</button><span class="sp"></span>${id?'<button type="button" class="b g" data-d style="color:var(--er)">Excluir</button>':""}</div></form>`;
document.body.append(o);const f=$("form",o);for(const n of ["t","d","r","dt","p","s"])f.elements[n].value=k[n];f.elements.t.focus();
const close=()=>{o.remove();document.removeEventListener("keydown",esc)},esc=e=>{if(e.key=="Escape")close()};document.addEventListener("keydown",esc);
o.onmousedown=e=>{if(e.target==o)close()};$("[data-c]",o).onclick=close;
if(id)$("[data-d]",o).onclick=()=>{if(confirm("Excluir esta tarefa?")){TK.splice(TK.findIndex(x=>x.id==id),1);close();draw();toast("Tarefa excluída")}};
f.onsubmit=e=>{e.preventDefault();const v=Object.fromEntries(new FormData(f));if(!v.t.trim())return;if(id)Object.assign(k,v);else TK.push({id:++tkId,...v});close();draw();toast(id?"Tarefa atualizada":"Tarefa criada")}}
const bars=(a,f=R)=>{const m=Math.max(...a.map(r=>r[1]));return a.map(r=>`<div style="margin:7px 0"><div class="h" style="display:flex;justify-content:space-between"><span>${r[0]}</span><span>${f(r[1])}</span></div><div class="bar" style="width:${Math.max(3,r[1]/m*100)}%"></div></div>`).join("")};
const kpi=(l,v,d)=>`<div class="c"><div class="l">${l}</div><div class="v">${v}</div><span class="${d>=0?"up":"dn"}">${d>=0?"▲":"▼"} ${Math.abs(d)}% vs. anterior</span></div>`;
const tbl=(h,rows)=>`<div class="tw"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const spark=()=>{const v=Array.from({length:27},(_,i)=>Math.round(40+Math.sin(i/3)*25+((i*37)%23)));return `<svg viewBox="0 0 540 150" style="width:100%" role="img" aria-label="Prêmio por dia">${v.map((y,i)=>`<rect x="${i*20+2}" y="${150-y*1.4}" width="16" height="${y*1.4}" rx="2" fill="#8B5CF6" opacity=".85"><title>Dia ${i+1}</title></rect>`).join("")}</svg>`};
const V={
dash:()=>`<h1>Dashboard</h1><div class="rw"><select aria-label="Período"><option>Mês atual</option><option>Hoje</option><option>Últimos 7 dias</option><option>Mês anterior</option><option>Personalizado</option></select><span class="h">01/10/2026 a 27/10/2026</span></div>
<div class="cs">${kpi("Volume de prêmio",R(412800),12)+kpi("Corretagem",R(49536),8)+kpi("Comissões de vendedores",R(16512),5)+kpi("Repasse recebido",R(31200),-3)+kpi("Repasse pendente",R(18336),9)+kpi("Novos clientes","23",15)+kpi("Oportunidades abertas","58",4)+kpi("Taxa de conversão","31,4%",2)+kpi("Apólices ativas","214",1)+kpi("Vencem em 30 dias","17",-6)+kpi("Vendas canceladas","3",-20)}</div>
<div class="gr"><div class="c"><h3>Prêmio negociado por dia</h3>${spark()}</div><div class="c"><h3>Conversão por etapa</h3>${bars(ST.slice(0,8).map((s,i)=>[s[0],[58,44,36,28,22,17,14,11][i]]),v=>v)}</div><div class="c"><h3>Comissões por vendedor</h3>${bars([["Ana Souza",7200],["Bruno Lima",5600],["Carla Dias",3712]])}</div><div class="c"><h3>Vendas por categoria</h3>${bars([["Automóvel",168000],["Saúde",94000],["Vida",72000],["Empresarial",51000],["Residencial",27800]])}</div>
<div class="c"><h3>Tarefas</h3>${[["Retornar Marina Alves","Hoje","a"],["Renovação AP-10412","Hoje","m"],["Enviar proposta Diego","Amanhã","l2"],["Cobrar documentos Vera","Atrasada","a"]].map(t=>`<p><input type="checkbox" style="width:auto" onchange="toast('Tarefa concluída (simulação)')"> ${t[0]} <span class="pl ${t[1]=="Atrasada"?"er":"vi"}">${t[1]}</span></p>`).join("")}</div>
<div class="c"><h3>Alertas</h3><p class="wr">⚠ 3 apólices vencem em até 30 dias</p><p class="wr">⚠ 5 leads sem acompanhamento</p><p class="er">✕ Integração WhatsApp: não configurada</p><p class="vi">ℹ 2 documentos para revisão</p></div></div>`,
kan:()=>`<div class="rw"><h1 style="margin:0">Kanban comercial</h1><span class="sp"></span><button class="b" onclick="toast('Formulário Novo Lead (simulação)')">+ Novo lead</button><button class="b g" onclick="toast('Editor de funil (simulação)')">Personalizar funil</button></div><p class="h">Arraste os cartões entre as etapas.</p><div class="bd">${ST.map((s,i)=>`<div class="cl" data-s="${i}"><h4 style="color:${s[1]}"><span>${s[0]}</span><span class="n">${LD.filter(l=>l.st==i).length}</span></h4>${LD.filter(l=>l.st==i).map(k=>`<div class="kc ${k.pr}" draggable="true" data-i="${LD.indexOf(k)}"><b>${k.n}</b><div>${k.cat} · ${k.s}</div><div>Prêmio ${R(k.p)} · Corret. ${R(k.p*.12)}</div><div>${k.d}d sem contato</div></div>`).join("")}</div>`).join("")}</div>`,
leads:()=>`<div class="rw"><h1 style="margin:0">Leads</h1><span class="sp"></span><input placeholder="Filtrar…" style="max-width:220px" aria-label="Filtrar"><button class="b" onclick="toast('Formulário Novo Lead (simulação)')">+ Novo lead</button></div><div class="c">${tbl(["Nome","Etapa","Categoria","Vendedor","Prêmio","Dias sem contato"],LD.map(l=>[l.n,`<span class="pl" style="color:${ST[l.st][1]}">${ST[l.st][0]}</span>`,l.cat,l.s,R(l.p),l.d]))}</div>`,
cli:()=>`<h1>Clientes</h1><div class="c">${tbl(["Nome","Telefone","Apólices","Cliente desde"],NM.slice(0,8).map((n,i)=>[n,`(31) 9${8100+i*13}-${1200+i*77}`,i%3+1,`${10+i}/0${i%8+1}/2025`]))}</div>`,
eq:()=>`<h1>Equipe comercial</h1><div class="c">${tbl(["Vendedor","Vendas","Prêmio","Corretagem","Comissão prev.","Comissão paga","Conversão"],SEL.map((s,i)=>[s,12-i*3,R(180000-i*45000),R(21600-i*5400),R(7200-i*1600),R(4100-i*900),(36-i*5)+"%"]))}</div>`,
tar:()=>{const h=hoje(),vis=TK.filter(k=>!tkF||k.r==tkF),late=vis.filter(k=>k.s!="done"&&k.dt<h).length;
return `<div class="rw"><h1 style="margin:0">Tarefas</h1><span class="sp"></span><select aria-label="Filtrar por responsável" onchange="tkF=this.value;draw()"><option value="">Todos os responsáveis</option>${SEL.map(s=>`<option ${s==tkF?"selected":""}>${s}</option>`).join("")}</select><button class="b" onclick="tkForm()">+ Nova tarefa</button></div>
